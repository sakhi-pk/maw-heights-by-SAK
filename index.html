<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAW Heights 1 – AR walkthrough demo</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#efe9dd;--ink:#2a251e;--mute:#cfc8b8;--bar:rgba(30,27,22,.92);--bi:#f3eee3;--brass:#c9a24d}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171613;--ink:#f3eee3}}
:root[data-theme="dark"]{--bg:#171613;--ink:#f3eee3}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px "Segoe UI",system-ui,sans-serif;overflow:hidden}
section{position:absolute;inset:0;touch-action:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
section[hidden]{display:none}
.w{position:relative;line-height:0}
.w img{max-width:100vw;max-height:calc(100vh - 190px);display:block;user-select:none;-webkit-user-drag:none}
#hot{position:absolute;left:11%;top:48.9%;width:36%;height:26.6%;border:2px solid var(--brass);background:rgba(201,162,77,.25);border-radius:4px;pointer-events:none}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#top{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:8px;flex-wrap:wrap;z-index:5}
.pill{background:var(--bar);color:var(--bi);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 13px;font-size:13px}
#bar{position:absolute;left:0;right:0;bottom:0;background:var(--bar);color:var(--bi);padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:5}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row[hidden]{display:none}
button{font:inherit;font-size:14px;color:var(--bi);background:transparent;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:7px 13px;cursor:pointer}
button.go{background:var(--brass);border-color:var(--brass);color:#1b1a17;font-weight:600}
button.on{border-color:var(--brass);color:var(--brass)}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
label{font-size:13px;color:var(--mute);min-width:52px}
input[type=range]{flex:1;min-width:110px;accent-color:var(--brass)}
#msg{font-size:12px;color:var(--mute);min-height:15px}
</style></head><body>
